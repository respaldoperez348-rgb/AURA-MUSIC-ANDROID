name: Build Aura Music Android APK

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aura-music-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
          name: Aura Music ${{ github.ref_name }} (Fase Beta)
          body: |
            ## 🚀 Aura Music ${{ github.ref_name }} [FASE BETA]
            
            > ⚠️ **Estado**: Esta versión se encuentra actualmente en **Fase Beta** de pruebas continuas. La versión estable oficial comenzará a partir de la versión **v2.5.0**.
            
            **Creador & Desarrollador Principal**: MANUEL DAVID TINEO
            
            ### ✨ Novedades de la versión 1.5.0 (Beta Edition)
            - 👤 **Créditos y Acerca de**: Reconocimiento oficial a **MANUEL DAVID TINEO** en la sección de Ajustes con versión 1.5.0 Cyber Edition.
            - 🌐 **Selector Multilenguaje**: Soporte de idiomas integrado (Español, English, Português, Français, Deutsch, 日本語).
            - ⚡ **Arranque Instantáneo y Modo Offline (0 ms)**: El inicio carga inmediatamente sin pantallas en blanco ni esperas por red.
            - 🎤 **Letras Inmersivas con Controles Persistentes**: Píldora sutil flotante `[ ⏸ PAUSAR ]`, controles siempre visibles en pausa y salida suave deslizando.
            - 🧭 **Nueva Dock Navegación y MiniPlayer Circular**: Cápsula de Inicio y Biblioteca con botón circular flotante de búsqueda y anillo de progreso acústico.
            - 🧹 **Gestor de Caché**: Limpieza rápida de memoria y carátulas de audio.
            - 🔔 **Notificaciones de Descarga**: Feedback instantáneo al completar descargas a la bóveda offline.
            - 💿 **Studio Deck**: Vinilo giratorio interactivo, letras oficiales sincronizadas y ecualizador DSP.
          draft: false
          prerelease: true
