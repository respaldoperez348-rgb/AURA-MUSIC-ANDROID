name: Build Aura Music Android APK

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aura-music-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
          name: Aura Music ${{ github.ref_name }} (Fase Beta)
          body: |
            ## 🚀 Aura Music ${{ github.ref_name }} [FASE BETA]
            
            > ⚠️ **Estado**: Esta versión se encuentra actualmente en **Fase Beta** de pruebas continuas. La versión estable oficial comenzará a partir de la versión **v2.5.0**.
            
            **Creador & Desarrollador Principal**: MANUEL DAVID TINEO
            
            ### ✨ Novedades de la versión 1.5.5 (Beta Edition)
            - 🎨 **Nuevo Icono Cyberpunk Neón**: Icono de aplicación rediseñado con nota musical de neón, ondas espectrales de audio y surcos de vinilo adaptativos.
            - 🔁 **Reproducción Continua & Gapless Playback**: Avance automático de canciones sin pausas ni bloqueos mediante encolado predictivo en ExoPlayer (`addMediaItem`).
            - 📋 **Cola Estricta en Bóveda y Favoritos**: Modo secuencial estricto en favoritos y listas locales, desactivando el shuffle no deseado y eliminando la inyección de pistas externas.
            - 🎤 **Sincronización de Letras sin Adelantos**: Ajuste de latencia de audio con offset configurable (-200 ms por defecto) y renderizado preciso en tiempo real.
            - 📱 **Barra de Estado del Sistema Visible**: Integración de Edge-to-Edge con iconos claros de reloj, batería y Wi-Fi protegidos con Window Insets.
            - 🔔 **Notificaciones Nativas de Descarga**: Progreso en vivo y aviso de finalización directamente en la bandeja de notificaciones del sistema Android.
            - ⚡ **Buscador Ultrarrápido con Debounce**: Reducción de cuellos de botella con debounce de 300 ms, cancelación inmediata de sockets y búsqueda local indexada.
            - 👤 **Créditos Oficiales**: Creador & Desarrollador Principal **MANUEL DAVID TINEO**.
            - 🔔 **Notificaciones de Descarga**: Feedback instantáneo al completar descargas a la bóveda offline.
            - 💿 **Studio Deck**: Vinilo giratorio interactivo, letras oficiales sincronizadas y ecualizador DSP.
          draft: false
          prerelease: true
