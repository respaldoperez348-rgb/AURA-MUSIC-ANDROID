name: Build Aura Music Android APK

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Release and Debug APKs
        run: ./gradlew assembleRelease assembleDebug --stacktrace --no-configuration-cache

      - name: Prepare Release APKs
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/release/app-release.apk release-assets/AuraMusic-${{ github.ref_name }}.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/AuraMusic-${{ github.ref_name }}-debug.apk

      - name: Upload APKs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aura-music-apks
          path: release-assets/*.apk
          retention-days: 14

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*.apk
          name: Aura Music ${{ github.ref_name }}
          body: |
            ## 🎵 Aura Music ${{ github.ref_name }} (Versión Estable)

            **Desarrollador Principal**: MANUEL DAVID TINEO

            ### ✨ Novedades y Características
            - 🚀 **Lanzamiento Oficial Estable**: La aplicación deja la fase beta y pasa a versión funcional estable.
            - 📥 **Descargas Offline Reales**: Descarga canciones directamente al almacenamiento local con carátulas incrustadas y soporte para filtro de solo Wi-Fi.
            - 🎨 **Selector de Temas Visuales Dinámicos**: Tema Oscuro OLED, Claro, Cyberpunk Neón, Sunset Retro y Deep Ocean.
            - 📻 **Auto-Radio Infinito (Automix)**: Encolado automático de música continua al terminar tu cola actual.
            - 💾 **Caché Inteligente de Disco**: Almacenamiento local para reproducción instantánea sin consumo repetido de datos móviles.
            - 🔄 **Actualizador Integrado**: Comprobación directa contra GitHub Releases con descarga de nuevas versiones desde Ajustes.
            - 📊 **Ecualizador DSP & Visualizador**: 5 bandas, BassBoost y espectro de audio en tiempo real.
          draft: false
          prerelease: false
